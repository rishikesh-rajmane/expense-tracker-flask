
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Register - Expense Tracker</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="min-h-screen bg-slate-900 text-white flex items-center justify-center p-4">

    <div class="w-full max-w-md rounded-xl border border-slate-700 p-8 bg-slate-800">

        <h1 class="text-2xl font-bold mb-2">Create your account</h1>
        <p class="text-slate-400 mb-6">Keep your expenses private.</p>

        {% with messages = get_flashed_messages(with_categories=true) %}
            {% for category, message in messages %}
                <p class="mb-4 text-sm {% if category == 'success' %}text-green-400{% else %}text-red-300{% endif %}">
                    {{ message }}
                </p>
            {% endfor %}
        {% endwith %}

        <form method="POST" action="{{ url_for('register') }}" class="space-y-4">

            <div>
                <label for="username" class="block mb-1">Username or email</label>
                <input
                    id="username"
                    name="username"
                    type="text"
                    required
                    minlength="3"
                    autocomplete="username"
                    class="w-full rounded-lg bg-slate-700 border border-slate-600 p-3 text-white focus:outline-none focus:ring-2 focus:ring-sky-500"
                    placeholder="Enter username or email"
                >
            </div>

            <div>
                <label for="password" class="block mb-1">Password</label>
                <input
                    id="password"
                    name="password"
                    type="password"
                    required
                    minlength="8"
                    autocomplete="new-password"
                    class="w-full rounded-lg bg-slate-700 border border-slate-600 p-3 text-white focus:outline-none focus:ring-2 focus:ring-sky-500"
                    placeholder="Create a password (min. 8 characters)"
                >
            </div>

            <button
                type="submit"
                class="w-full rounded-lg bg-sky-600 hover:bg-sky-500 p-3 font-semibold transition"
            >
                Create account
            </button>

        </form>

        <p class="mt-6 text-sm text-slate-300">
            Already have an account?
            <a href="{{ url_for('login') }}" class="text-sky-400 hover:underline">
                Log in
            </a>
        </p>

    </div>

</body>
</html>

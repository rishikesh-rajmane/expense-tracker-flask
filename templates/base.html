
<header class="border-b border-slate-800 bg-slate-900/60 backdrop-blur">
  <div class="mx-auto max-w-6xl px-4 py-4 flex items-center justify-between">

    <!-- Logo -->
    <a href="{{ url_for('index') if current_user.is_authenticated else url_for('login') }}"
       class="text-xl font-bold tracking-tight">
      <span class="text-brand">Expense</span> Tracker
      <span class="text-slate-400">Lite</span>
    </a>

    <!-- Navigation -->
    {% if current_user.is_authenticated %}
    <nav class="flex items-center gap-4">

      {% if current_user.is_admin %}
      <a href="{{ url_for('admin_users') }}"
         class="text-sky-400 hover:text-sky-300 font-semibold text-sm">
        Manage Users
      </a>
      {% endif %}

      <form method="POST" action="{{ url_for('logout') }}">
        <button type="submit"
                class="rounded-lg bg-rose-600 hover:bg-rose-500 px-4 py-2 text-sm font-semibold">
          Logout
        </button>
      </form>

    </nav>
    {% endif %}

  </div>
</header>
